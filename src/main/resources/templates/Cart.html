
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Indkøbskurv')}"></head>

<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <div th:replace="~{fragments :: messages}"></div>

    <h1>Din indkøbskurv</h1>

    <p th:if="${Cart.empty}">
        Din kurv er tom.
        <a href="/#bestil">Bestil cupcakes her</a>
    </p>

    <div th:unless="${Cart.empty}">

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Produkt</th>
                    <th>Antal</th>
                    <th>Pris</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="line, stat : ${Cart.lines}">
                    <td>
                        <strong th:text="${line.bottom.name}">Chokolade</strong>
                        <span> + </span>
                        <span th:text="${line.topping.name}">Vanilje</span>
                    </td>

                    <td th:text="${line.quantity}">2</td>

                    <td th:text="${line.linePrice} + ' kr'">
                        50 kr
                    </td>

                    <td>
                        <form method="post" action="/Cart/remove">
                            <input type="hidden"
                                   name="index"
                                   th:value="${stat.index}">

                            <button type="submit" class="delete-button">
                                Fjern
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="cart-summary">
            <span>Total:</span>
            <strong th:text="${Cart.total} + ' kr'">100 kr</strong>
        </div>

        <div class="cart-actions">
            <a href="/#bestil" class="button button-light">
                Fortsæt med at handle
            </a>

            <form method="post" action="/checkout">
                <button type="submit">Gå til betaling</button>
            </form>
        </div>

        <p th:if="${currentUser == null}" class="hint">
            Du skal logge ind for at betale.
        </p>
    </div>
</main>
</body>
</html>
