
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Kunder')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <div th:replace="~{fragments :: messages}"></div>
    <h1>Administration</h1>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="/admin/orders">Ordrer</a>
            <a href="/admin/customers" class="active">Kunder</a>
            <a href="/">Forside</a>
        </aside>

        <section class="admin-content">
            <h2>Kunder</h2>

            <p th:if="${customers == null or customers.empty}">
                Der er ingen kunder endnu.
            </p>

            <section th:each="c : ${customers}"
                     class="panel"
                     th:with="cOrders=${ordersByUser.get(c.userId)}">

                <h3 th:text="${c.email}">kunde@mail.dk</h3>
                <p th:text="'Saldo: ' + ${c.balance} + ' kr'">
                    Saldo
                </p>

                <p th:if="${cOrders == null or cOrders.empty}">
                    Ingen ordrer.
                </p>

                <ul th:unless="${cOrders == null or cOrders.empty}">
                    <li th:each="o : ${cOrders}"
                        th:text="'Ordre ' + ${o.orderId}
                        + ' · ' + ${o.total} + ' kr'">
                        Ordre
                    </li>
                </ul>
            </section>
        </section>
    </div>
</main>
</body>
</html>
