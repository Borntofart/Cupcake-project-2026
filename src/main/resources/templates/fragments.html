
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${title} + ' | OLSKER CUPCAKES'">
        OLSKER CUPCAKES
    </title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header th:fragment="header" class="site-header">

    <div class="header-banner">
        <div class="header-inner">

            <a href="/" class="brand-link">
                <img src="/images/olsker-logo.png"
                     alt="OLSKER CUPCAKES"
                     class="brand-image">
            </a>

            <img src="/images/cupcakelogo.png"
                 alt="Cupcakes"
                 class="cupcake-image">

        </div>
    </div>

    <nav class="nav">

        <div class="nav-links">

            <a href="/">Forside</a>

            <a href="/#bestil">Bestil cupcakes</a>

            <a th:if="${currentUser != null and currentUser.admin}"
               href="/admin/orders">
                Ordrer
            </a>

            <a th:if="${currentUser != null and currentUser.admin}"
               href="/admin/customers">
                Kunder
            </a>

            <a th:if="${currentUser != null}"
               href="/orders">
                Mine ordrer
            </a>

        </div>

        <div class="nav-links">

            <span th:if="${currentUser != null}"
                  th:text="${currentUser.email}"
                  class="user-info">
            </span>

            <a href="/Cart">
                🛒 Kurv (<span th:text="${Cart.count}">0</span>)
            </a>

            <a th:if="${currentUser == null}"
               href="/login">
                Log ind
            </a>

            <a th:if="${currentUser != null}"
               href="/logout">
                Log ud
            </a>

        </div>

    </nav>

</header>

<div th:fragment="messages" class="messages">

    <p th:if="${message != null}"
       th:text="${message}"
       class="msg">
    </p>

    <p th:if="${error != null}"
       th:text="${error}"
       class="error">
    </p>

</div>

</body>
</html>
