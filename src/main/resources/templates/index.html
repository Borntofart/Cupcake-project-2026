
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Forside')}"></head>

<body>

<header th:replace="~{fragments :: header}"></header>

<main class="container">

    <div th:replace="~{fragments :: messages}"></div>

    <section class="hero">

        <h1>Velkommen ombord</h1>

        <p>
            Øens bedste cupcakes. Vælg din yndlingsbund
            og topping, og sammensæt din helt egen cupcake.
        </p>

        <a href="#bestil" class="button">
            Byg din cupcake
        </a>

    </section>

    <section class="benefits">

        <span>♡ Friske råvarer</span>

        <span>✦ Håndlavede cupcakes</span>

        <span>✓ Nem bestilling</span>

    </section>

    <section id="bestil" class="builder">

        <h1>Byg din cupcake</h1>

        <form method="post"
              action="/cart/add"
              class="builder-form">

            <div class="selection-box">

                <h2>Vælg bund</h2>

                <label class="radio-line"
                       th:each="bottom : ${bottoms}">

                    <input type="radio"
                           name="bottom"
                           th:value="${bottom.bottomId}"
                           required>

                    <span th:text="${bottom.name}">
                        Chokolade
                    </span>

                    <span th:text="'(' + ${bottom.price} + ' kr)'">
                        (15 kr)
                    </span>

                </label>

            </div>

            <div class="selection-box">

                <h2>Vælg topping</h2>

                <label class="radio-line"
                       th:each="topping : ${toppings}">

                    <input type="radio"
                           name="topping"
                           th:value="${topping.toppingId}"
                           required>

                    <span th:text="${topping.name}">
                        Hindbær
                    </span>

                    <span th:text="'(' + ${topping.price} + ' kr)'">
                        (15 kr)
                    </span>

                </label>

            </div>

            <div class="builder-footer">

                <label class="quantity-label">
                    Antal cupcakes

                    <input type="number"
                           name="quantity"
                           value="1"
                           min="1"
                           max="50"
                           required>
                </label>

                <button type="submit">
                    Læg i kurv 🛒
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
