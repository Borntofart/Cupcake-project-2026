
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Mine ordrer')}"></head>

<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <div th:replace="~{fragments :: messages}"></div>

    <h1>Mine ordrer</h1>

    <p th:if="${orders == null or orders.empty}">
        Du har endnu ikke bestilt noget.
    </p>

    <div th:each="o : ${orders}" class="order-card">
        <h2>
            Ordre #<span th:text="${o.orderId}">1</span>
        </h2>

        <p>
            Dato:
            <span th:text="${#temporals.format(o.createdAt, 'dd-MM-yyyy HH:mm')}">
                01-11-2026
            </span>
        </p>

        <div class="order-items">
            <p th:each="l : ${o.lines}"
               th:text="${l.quantity} + ' x ' +
               ${l.bottom.name} + ' med ' +
               ${l.topping.name} + ' – ' +
               ${l.linePrice} + ' kr'">
            </p>
        </div>

        <p class="order-total">
            Total:
            <strong th:text="${o.total} + ' kr'">100 kr</strong>
        </p>
    </div>
</main>
</body>
</html>
